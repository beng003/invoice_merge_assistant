name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pymupdf numpy pyinstaller PySide6-Essentials

      - name: Build exe
        run: pyinstaller --noconfirm --clean "build_app/InvoiceMerge-win.spec"

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          Write-Host "Found: $($exe.FullName)"
          & $exe.FullName --help

      - name: Zip dist folder
        shell: pwsh
        run: python -c "import shutil; shutil.make_archive('dist/InvoiceMerge_Windows', 'zip', 'dist', '发票合并小助手')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceMerge_Windows
          path: dist/InvoiceMerge_Windows.zip
          retention-days: 30

name: build-mac

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pymupdf numpy pyinstaller PySide6-Essentials

      - name: Build app
        run: pyinstaller --noconfirm --clean "build_app/InvoiceMerge_mac.spec"

      - name: Smoke test CLI
        run: "dist/发票合并小助手.app/Contents/MacOS/发票合并小助手 --help"

      - name: Zip app bundle
        run: ditto -c -k --sequesterDir --keepParent "dist/发票合并小助手.app" "dist/InvoiceMerge_MacOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceMerge_MacOS
          path: dist/InvoiceMerge_MacOS.zip
          retention-days: 30

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InvoiceMerge_MacOS.zip
